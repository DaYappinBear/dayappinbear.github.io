<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaYappinBear's Silly Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            width: 100%;
        }

        body {
            background-color: #ED8F91;
            color: #24151B;
            font-family: "Ink Free", sans-serif;
        }

        .homepage {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("bg.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top left;
        }

        /* UNDER-CONSTRUCTION MESSAGE */
        .construction {
            position: absolute;
            top: 14%;
            left: 25%;
            width: 50%;
            margin: 0;
            padding: 8px 12px;
            color: #24151B;
            font-family: "Ink Free", sans-serif;
            font-size: clamp(14px, 2vw, 24px);
            text-align: center;
            line-height: 1.4;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 12px;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            display: block;
            background: transparent;
            text-decoration: none;
        }

        .medium {
            top: 6%;
            left: 34.5%;
            width: 12%;
            height: 8%;
        }

        .minefun {
            top: 6%;
            left: 49%;
            width: 12%;
            height: 8%;
        }

        .art {
            top: 22%;
            left: 2%;
            width: 13%;
            height: 19%;
        }

        .books {
            top: 24%;
            left: 20%;
            width: 15%;
            height: 19%;
        }

        .spoilers {
            top: 53%;
            left: 2%;
            width: 14%;
            height: 25%;
        }

        .about {
            top: 54%;
            left: 19%;
            width: 10%;
            height: 24%;
        }

        .right-art-one {
            top: 22%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .right-art-two {
            top: 45%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .right-art-three {
            top: 68%;
            left: 72%;
            width: 12%;
            height: 19%;
        }
    </style>
</head>

<body>
    <main class="homepage">

        <p class="construction">
            this website is under construction so pls wait :-)
        </p>

        <a class="hotspot medium"
           href="https://medium.com/@gauribgurjar"
           aria-label="Visit Medium"></a>

        <a class="hotspot minefun"
           href="https://minefun.io/"
           aria-label="Visit Minefun"></a>

        <a class="hotspot art"
           href="art.html"
           aria-label="My Art"></a>

        <a class="hotspot books"
           href="books.html"
           aria-label="My Books"></a>

        <a class="hotspot spoilers"
           href="spoilers.html"
           aria-label="Spoilers"></a>

        <a class="hotspot about"
           href="about.html"
           aria-label="About Me"></a>

        <a class="hotspot right-art-one"
           href="art.html"
           aria-label="My Art"></a>

        <a class="hotspot right-art-two"
           href="art.html"
           aria-label="My Art"></a>

        <a class="hotspot right-art-three"
           href="art.html"
           aria-label="My Art"></a>

    </main>
</body>
</html>
