
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaYappinBear's Silly Website</title>
    <meta name="description" content="Welcome to DaYappinBear's silly website! Explore my art, books, spoilers, and more.">

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            width: 100%;
        }

        body {
            background-color: #ED8F91;
            color: #24151B;
            font-family: "Ink Free", sans-serif;
        }

        .homepage {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("bg.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top left;
        }

        .hotspot {
            position: absolute;
            display: block;
            background: transparent;
            text-decoration: none;
        }

        /* Keeps link names available to screen readers
           without displaying them over the background image. */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .medium {
            top: 6%;
            left: 34.5%;
            width: 12%;
            height: 8%;
        }

        .minefun {
            top: 6%;
            left: 49%;
            width: 12%;
            height: 8%;
        }

        .art {
            top: 22%;
            left: 2%;
            width: 13%;
            height: 19%;
        }

        .books {
            top: 24%;
            left: 20%;
            width: 15%;
            height: 19%;
        }

        .spoilers {
            top: 53%;
            left: 2%;
            width: 14%;
            height: 25%;
        }

        .about {
            top: 54%;
            left: 19%;
            width: 10%;
            height: 24%;
        }

        .right-art-one {
            top: 22%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .right-art-two {
            top: 45%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .right-art-three {
            top: 68%;
            left: 72%;
            width: 12%;
            height: 19%;
        }
    </style>
</head>

<body>
    <main class="homepage" aria-label="DaYappinBear's homepage">

        <a class="hotspot medium"
           href="https://medium.com/@gauribgurjar"
           aria-label="Visit my Medium page">
            <span class="visually-hidden">My Medium page</span>
        </a>

        <a class="hotspot minefun"
           href="https://minefun.io/"
           aria-label="Visit Minefun">
            <span class="visually-hidden">Minefun</span>
        </a>

        <a class="hotspot art"
           href="art.html"
           aria-label="View my art gallery">
            <span class="visually-hidden">My Art Gallery</span>
        </a>

        <a class="hotspot books"
           href="books.html"
           aria-label="Explore my books">
            <span class="visually-hidden">My Books</span>
        </a>

        <a class="hotspot spoilers"
           href="spoilers.html"
           aria-label="Visit the spoilers page">

        </a>

        <a class="hotspot about"
           href="about.html"
           aria-label="Learn about me">
            <span class="visually-hidden">About Me</span>
        </a>

        <a class="hotspot right-art-one"
           href="art.html"
           aria-label="View my art gallery">

        </a>

        <a class="hotspot right-art-two"
           href="art.html"
           aria-label="View my art gallery">
            <span class="visually-hidden">My Art Gallery</span>

        <a class="hotspot right-art-three"
           href="art.html"
           aria-label="View my art gallery">
            <span class="visually-hidden">My Art Gallery</span>
        </a>

    </main>
</body>
</html>
