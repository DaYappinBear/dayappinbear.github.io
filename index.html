
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DaYappinBear's Silly Website</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            min-height: 100%;
            width: 100%;
        }

        body {
            background-color: #ED8F91;
            color: #24151B;
            font-family: "Ink Free", sans-serif;
        }

        .homepage {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("bg.png");
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: top left;
        }

        .hotspot {
            position: absolute;
            display: block;
            background: transparent;
            text-decoration: none;
        }

        .medium {
            top: 6%;
            left: 34.5%;
            width: 12%;
            height: 8%;
        }

        .minefun {
            top: 6%;
            left: 49%;
            width: 12%;
            height: 8%;
        }

        .art {
            top: 22%;
            left: 2%;
            width: 13%;
            height: 19%;
        }

        .books {
            top: 24%;
            left: 20%;
            width: 15%;
            height: 19%;
        }

        .spoilers {
            top: 53%;
            left: 2%;
            width: 14%;
            height: 25%;
        }

        .about {
            top: 54%;
            left: 19%;
            width: 10%;
            height: 24%;
        }

        .right-art-one {
            top: 22%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .right-art-two {
            top: 45%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .right-art-three {
            top: 68%;
            left: 72%;
            width: 12%;
            height: 19%;
        }

        .visitor-counter {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 10px;
            text-align: center;
            font-family: "Ink Free", sans-serif;
            color: #24151B;
            z-index: 10;
        }

        .visitor-counter p {
            margin: 0 0 5px;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <main class="homepage">

        <!-- Invisible clickable hotspots -->

        <a class="hotspot medium"
           href="https://medium.com/@gauribgurjar"
           aria-label="Visit Medium">
            <span hidden>Visit Medium</span>
        </a>

        <a class="hotspot minefun"
           href="https://minefun.io/"
           aria-label="Visit Minefun">
            <span hidden>Visit Minefun</span>
        </a>

        <a class="hotspot art"
           href="art.html"
           aria-label="My Art">
            <span hidden>My Art</span>
        </a>

        <a class="hotspot books"
           href="books.html"
           aria-label="My Books">
            <span hidden>My Books</span>
        </a>

        <a class="hotspot spoilers"
           href="spoilers.html"
           aria-label="Spoilers">
            <span hidden>Spoilers</span>
        </a>

        <a class="hotspot about"
           href="about.html"
           aria-label="About Me">
            <span hidden>About Me</span>
        </a>

        <a class="hotspot right-art-one"
           href="art.html"
           aria-label="My Art">
            <span hidden>My Art</span>
        </a>

        <a class="hotspot right-art-two"
           href="art.html"
           aria-label="My Art">
            <span hidden>My Art</span>
        </a>

        <a class="hotspot right-art-three"
           href="art.html"
           aria-label="My Art">
            <span hidden>My Art</span>
        </a>


        <!-- Visitor counter -->

        <div class="visitor-counter">
            <p>Visitors to this website:</p>
            <div id="visitor-number">Loading...</div>
        </div>

    </main>


    <!-- GoatCounter tracking script -->

    <script
        data-goatcounter="https://YOURACCOUNTNAME.goatcounter.com/count"
        async
        src="https://gc.zgo.at/count.js">
    </script>


    <!-- Display the total visitor count -->

    <script>
        const counterTimer = setInterval(function () {

            if (
                window.goatcounter &&
                window.goatcounter.visit_count
            ) {
                clearInterval(counterTimer);

                window.goatcounter.visit_count({
                    append: "#visitor-number",
                    path: "TOTAL"
                });
            }

        }, 100);
    </script>

</body>
</html>
